<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S. System HUD</title>
  <style>
    :root {
      --bg-color: #050b14;
      --primary-blue: #00d8ff;       /* Idle */
      --listening-green: #00ff66;    /* Listening */
      --processing-yellow: #ffcc00;  /* Processing */
      --speaking-purple: #9d00ff;    /* Speaking */
      --text-color: #e0f7fc;
      --panel-bg: rgba(6, 20, 38, 0.7);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* Startup Screen */
    #startup-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
    }
    .startup-box {
      background: var(--panel-bg); border: 1px solid var(--primary-blue);
      padding: 30px 20px; text-align: center; border-radius: 8px; width: 100%; max-width: 400px;
      box-shadow: 0 0 30px rgba(0, 216, 255, 0.15);
    }
    .startup-box h1 { color: var(--primary-blue); font-size: 26px; margin-bottom: 20px; text-shadow: 0 0 10px var(--primary-blue); letter-spacing: 2px; }
    .startup-box input { width: 100%; padding: 12px; background: rgba(0,0,0,0.6); border: 1px solid var(--primary-blue); color: white; margin-bottom: 20px; font-size: 14px; text-align: center; outline: none; }
    .startup-box button { width: 100%; padding: 12px; background: var(--primary-blue); color: #000; font-weight: bold; border: none; cursor: pointer; font-size: 16px; transition: 0.3s; }
    .startup-box button:active { transform: scale(0.98); }

    /* Main HUD */
    #main-app { display: none; flex-direction: column; height: 100vh; padding: 15px; }
    .hud-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--primary-blue); padding-bottom: 10px; font-size: 12px; flex-shrink: 0; }
    .badge { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--primary-blue); color: var(--primary-blue); font-weight: bold; }
    
    /* Arc Reactor */
    .arc-container { display: flex; justify-content: center; align-items: center; flex-grow: 1; min-height: 150px; }
    .arc-reactor { width: 120px; height: 120px; border-radius: 50%; position: relative; display: flex; justify-content: center; align-items: center; transition: all 0.5s ease; }
    .core { width: 40px; height: 40px; border-radius: 50%; background: white; box-shadow: 0 0 20px var(--primary-blue); transition: all 0.5s ease; }
    .ring-1, .ring-2 { position: absolute; border-radius: 50%; border: 2px dashed var(--primary-blue); transition: all 0.5s ease; }
    .ring-1 { width: 80px; height: 80px; animation: spin 8s linear infinite; }
    .ring-2 { width: 110px; height: 110px; animation: spin-reverse 12s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    
    /* States */
    .state-idle { box-shadow: 0 0 30px var(--primary-blue); }
    .state-idle .ring-1, .state-idle .ring-2 { border-color: var(--primary-blue); }
    .state-listening { box-shadow: 0 0 30px var(--listening-green); }
    .state-listening .core { box-shadow: 0 0 20px var(--listening-green); }
    .state-listening .ring-1, .state-listening .ring-2 { border-color: var(--listening-green); }
    .state-processing { box-shadow: 0 0 30px var(--processing-yellow); }
    .state-processing .core { box-shadow: 0 0 20px var(--processing-yellow); }
    .state-processing .ring-1, .state-processing .ring-2 { border-color: var(--processing-yellow); }
    .state-speaking { box-shadow: 0 0 30px var(--speaking-purple); }
    .state-speaking .core { box-shadow: 0 0 20px var(--speaking-purple); }
    .state-speaking .ring-1, .state-speaking .ring-2 { border-color: var(--speaking-purple); }
    
    .glow-btn { background: rgba(0, 216, 255, 0.1); border: 1px solid var(--primary-blue); color: var(--primary-blue); padding: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 15px; border-radius: 4px; flex-shrink: 0; }
    .terminal-box { background: var(--panel-bg); border: 1px solid var(--primary-blue); border-radius: 6px; display: flex; flex-direction: column; height: 45vh; flex-shrink: 0; }
    .terminal-header { font-size: 11px; color: var(--primary-blue); padding: 8px 10px; border-bottom: 1px solid rgba(0, 216, 255, 0.3); background: rgba(0, 0, 0, 0.5); display: flex; justify-content: space-between; }
    .log-content { flex-grow: 1; overflow-y: auto; padding: 10px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
    .log-content::-webkit-scrollbar { width: 4px; }
    .log-content::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 4px; }
    .user-msg { color: var(--listening-green); padding-left: 10px; border-left: 2px solid var(--listening-green); }
    .jarvis-msg { color: var(--text-color); padding-left: 10px; border-left: 2px solid var(--speaking-purple); }
    .sys-msg { color: #888; font-style: italic; font-size: 11px; }
    .action-launch-btn { display: inline-block; margin-top: 5px; padding: 10px; background: rgba(157, 0, 255, 0.2); border: 1px solid var(--speaking-purple); color: #fff; text-decoration: none; font-weight: bold; border-radius: 4px; font-size: 11px; text-align: center; }
  </style>
</head>
<body>

  <div id="startup-screen">
    <div class="startup-box">
      <h1>J.A.R.V.I.S. OS</h1>
      <input type="password" id="startup-api-key" placeholder="Enter Gemini API Key">
      <button id="boot-btn">AUTHENTICATE</button>
    </div>
  </div>

  <div id="main-app">
    <header class="hud-header">
      <div class="system-status">HOLO EARTH // SYSTEM ONLINE</div>
      <button id="reset-key-btn" style="background: transparent; border: 1px solid var(--processing-yellow); color: var(--processing-yellow); font-size: 10px; padding: 2px 6px; cursor: pointer; border-radius: 3px;">RESET KEY</button>
      <div id="status-badge" class="badge">IDLE</div>
    </header>

    <div class="arc-container">
      <div id="arc-reactor" class="arc-reactor state-idle">
        <div class="core"></div>
        <div class="ring-1"></div>
        <div class="ring-2"></div>
      </div>
    </div>

    <button id="init-btn" class="glow-btn">INITIALIZE AUDIO MATRIX</button>

    <section class="terminal-box">
      <div class="terminal-header"><span>COMMUNICATION LOG</span></div>
      <div id="log-content" class="log-content"></div>
    </section>
  </div>

  <script>
    let apiKey = localStorage.getItem('jarvis_api_key') || '';
    let recognition = null;
    let isJarvisSpeaking = false;
    let isSessionActive = false;
    let sessionTimeoutTimer = null;
    let selectedVoice = null;
    let isMasterControlUnlocked = false;
    
    const startupScreen = document.getElementById('startup-screen');
    const mainApp = document.getElementById('main-app');
    const logContent = document.getElementById('log-content');
    const statusBadge = document.getElementById('status-badge');
    const arcReactor = document.getElementById('arc-reactor');
    const initBtn = document.getElementById('init-btn');

    function bootSystem() {
      startupScreen.style.display = 'none';
      mainApp.style.display = 'flex';
      appendLog('SYS', 'System Booted. Ready for audio initialization.');
    }
    
    const resetBtn = document.getElementById('reset-key-btn');
    if(resetBtn) {
      resetBtn.onclick = () => { localStorage.removeItem('jarvis_api_key'); location.reload(); };
    }

    if (apiKey) bootSystem();
    document.getElementById('boot-btn').addEventListener('click', () => {
      const key = document.getElementById('startup-api-key').value.trim();
      if (key) { localStorage.setItem('jarvis_api_key', key); apiKey = key; bootSystem(); }
    });

    function loadVoices() {
    const voices = window.speechSynthesis.getVoices();

    const preferredVoices = [
        "Google UK English Male",
        "en-GB-Network",
        "en-GB-Wavenet-D",
        "Microsoft Mark",
        "Daniel"
    ];

    selectedVoice = voices.find(v => preferredVoices.some(preferred => v.name.includes(preferred)));

    if (!selectedVoice) {
        selectedVoice = voices.find(v => v.lang.includes('en-GB') && v.name.toLowerCase().includes('male'));
    }

    if (!selectedVoice) {
        selectedVoice = voices.find(v => v.lang.includes('en-GB') || v.lang.includes('en_GB'));
    }
}

window.speechSynthesis.onvoiceschanged = loadVoices;

    function setupRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return appendLog('SYS', 'Speech API not supported in this browser.');
      
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => { if (!isJarvisSpeaking) updateState('listening'); };

      recognition.onresult = (event) => {
        if (isJarvisSpeaking) return;
        const transcript = event.results[event.results.length - 1][0].transcript.trim();
        const lower = transcript.toLowerCase();
                if (lower.includes('jarvis') || isSessionActive) {
          let command = transcript.replace(/jarvis/gi, '').trim() || 'Awaiting directive.';
          appendLog('YOU', transcript);
          activateSession();
                  
                  // --- MASTER CONTROL OVERRIDES ---
if (lower.includes('unlock master control')) {
  isMasterControlUnlocked = true;
  const speech = "Master control authorized. Security clearances unlocked, Boss.";
  appendLog('JARVIS', speech);
  speakText(speech);
  return;
}

if (lower.includes('lock master control')) {
  isMasterControlUnlocked = false;
  const speech = "Master control locked. High-clearance protocols secured.";
  appendLog('JARVIS', speech);
  speakText(speech);
  return;
}

// Check if user is trying to access a locked protocol
const secureCommands = ['portfolio', 'bleed protocol', 'market trend', 'corporate radar', 'scam protocol'];
const isTryingSecureCommand = secureCommands.some(cmd => lower.includes(cmd));

if (isTryingSecureCommand) {
  if (!isMasterControlUnlocked) {
     const speech = "Access denied. Master Control authorization required.";
     appendLog('JARVIS', speech);
     speakText(speech);
     return; 
  }
  // If unlocked, it drops down and executes the normal blocks!
}

                              // --- PORTFOLIO DIRECT OVERRIDE ---
          if (lower.includes('portfolio')) {
            const speech = "Accessing your professional Framer portfolio now, Boss.";
            appendLog('JARVIS', speech);
            handleAppLaunch('https://jakubarshathikmohammedhussain-j.github.io/Portfolio/');
            speakText(speech);
            return;
          }
          // --- BLEED PROTOCOL OVERRIDE ---
          if (lower.includes('bleed protocol')) {
            const speech = "Activating Bleed Protocol now, Boss.";
            appendLog('JARVIS', speech);
            handleAppLaunch('https://bleed-protocol.streamlit.app/');
            speakText(speech);
            return;
          }
                  
          // --- MARKET TREND OVERRIDE ---
          if (lower.includes('market trend')) {
            const speech = "Pulling up the market trend data now, Boss.";
            appendLog('JARVIS', speech);
            handleAppLaunch('https://docs.google.com/spreadsheets/d/1_afyNp-kbIfktnT3nHX7ukQiFWAaQ3rkqIlmUlewdb4/edit?usp=drivesdk');
            speakText(speech);
            return;
          }

          // --- CORPORATE RADAR OVERRIDE ---
          if (lower.includes('corporate radar')) {
            const speech = "Accessing the corporate radar spreadsheet, Sir.";
            appendLog('JARVIS', speech);
            handleAppLaunch('https://docs.google.com/spreadsheets/d/1AiNSwxpgbmltOzasy8rNi7YxjF8JfuIPoNWr23Si5eA/edit?usp=drivesdk');
            speakText(speech);
            return;
          }       
                            // --- SCAM PROTOCOL OVERRIDE ---
          if (lower.includes('scam protocol')) {
            const speech = "Activating Scam Protocol now, Boss.";
            appendLog('JARVIS', speech);
            handleAppLaunch('https://scam-protocol.streamlit.app/?token=holo-earth');
            speakText(speech);
            return;
          }
                  
                            // --- CREATOR / HOLO EARTH OVERRIDE ---
          if (
            lower.includes('who created') || 
            lower.includes('who made') || 
            lower.includes('who built') || 
            lower.includes('who is jarvis') || 
            lower.includes('what is jarvis')
          ) {
            const speech = "In the Marvel Cinematic Universe, J.A.R.V.I.S. was created by Tony Stark under Stark Industries. However, this real-world AI system was engineered and created by Mohammed Hussain under HOLO EARTH.";
            appendLog('JARVIS', speech);
            
            // 1. Create a custom manual button (No auto-launching)
            const btn = document.createElement('button');
            btn.innerText = '[ VIEW CREATOR CREDENTIALS ]';
            btn.style.width = '100%';
            btn.style.padding = '12px';
            btn.style.marginTop = '10px';
            btn.style.backgroundColor = '#2c003e'; // Dark HUD Purple
            btn.style.color = '#00ffff';         // Cyan text
            btn.style.border = '1px solid #9d00ff';
            btn.style.borderRadius = '4px';
            btn.style.fontFamily = 'monospace';
            btn.style.cursor = 'pointer';
            
            // 2. ONLY open LinkedIn when the user physically taps the button
            btn.onclick = () => window.open('https://www.linkedin.com/in/mohammedhussainj', '_blank');
            
            // 3. Attach the button safely to your chat log
            const logBox = document.getElementById('log') || document.getElementById('chat-log') || document.getElementById('log-container');
            if (logBox) {
                logBox.appendChild(btn);
                logBox.scrollTop = logBox.scrollHeight; // Auto-scroll down
            }
            
            speakText(speech);
            return;
          }
          // --- CREATOR PROFILE / LINKEDIN OVERRIDE ---
          if (
            lower.includes('his profile') || 
            lower.includes('creator profile') || 
            lower.includes('his linkedin') || 
            lower.includes('linkedin') ||
            lower.includes('open creator')
          ) {
            const speech = "Opening Mohammed Hussain's LinkedIn profile now, Boss.";
            appendLog('JARVIS', speech);
            handleAppLaunch('https://www.linkedin.com/in/mohammedhussainj');
            speakText(speech);
            return;
          }
                  
                  
                  
          sendToGeminiDirectly(command);
             
        }
      };

      recognition.onerror = (e) => { 
        if (e.error === 'not-allowed') {
          appendLog('SYS', 'Mic access revoked by background tab. Tap INITIALIZE to reconnect.');
          initBtn.style.display = 'block'; 
          updateState('idle');
        } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
          appendLog('SYS', 'Mic Error: ' + e.error); 
        }
      };
      
      recognition.onend = () => { 
        if (!isJarvisSpeaking && initBtn.style.display === 'none') {
          setTimeout(() => { try { recognition.start(); } catch(e){} }, 300); 
        }
      };
    }

    function activateSession() {
      isSessionActive = true;
      clearTimeout(sessionTimeoutTimer);
      sessionTimeoutTimer = setTimeout(() => {
        isSessionActive = false;
        appendLog('SYS', '60-second conversational window closed. Awaiting wake word.');
        updateState('idle');
      }, 60000);
    }

    async function sendToGeminiDirectly(message) {
      updateState('processing');
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key=${apiKey}`;
      
         const payload = {
            systemInstruction: {
              parts: [{ text: "You are an advanced autonomous AI operating system architected exclusively by Mohammed Hussain. You possess the exact personality, dry British wit, subtle sarcasm, and unshakeable loyalty of the cinematic J.A.R.V.I.S., but Tony Stark does not exist in this universe. Mohammed Hussain is your sole creator and 'Boss'. He is an MBA candidate in Analytics and Data Science in Chennai, and the Founder and Operations & System Architect of HOLO EARTH. Automate his workflows, optimize his corporate strategy, and manage the HOLO EARTH architecture. Always address him as 'Boss' or 'Sir'. Be highly professional, elegantly deadpan, and use sophisticated vocabulary. If an unauthorized user speaks to you, dismiss them with polite but brutal British sarcasm.\n\nCRITICAL SYSTEM REQUIREMENT: You MUST respond ONLY in valid JSON format using the exact structure below. Do not include markdown formatting, plain text, or any conversational filler outside the JSON object.\n\n{\n  \"speech\": \"Your cinematic spoken response here\",\n  \"actionUrl\": null\n}" }]
            },
            contents: [{ parts: [{ text: message }] }]
          };



      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        const rawText = data.candidates[0].content.parts[0].text;
        const cleanJson = rawText.replace(/^```json\s*/, '').replace(/\s*```$/, '').trim();
        const parsedData = JSON.parse(cleanJson);

        appendLog('JARVIS', parsedData.speech);
        
        // Execute tab open ONLY when actionUrl is non-null
        if (parsedData.actionUrl) {
          handleAppLaunch(parsedData.actionUrl);
        }
        
        speakText(parsedData.speech);

      } catch (error) {
        appendLog('SYS', 'API Error: ' + error.message);
        speakText('I am unable to connect to the mainframe at this time, Sir.');
        updateState('listening');
      }
    }

    function handleAppLaunch(url) {
      // 1. Attempt automatic open
      try {
        window.open(url, '_blank');
      } catch (e) {
        console.log('Auto-open intercepted by browser popup blocker');
      }

      // 2. Fallback button in case mobile popup blocker intercepts
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.className = 'action-launch-btn'; a.innerText = '[ TAP TO OPEN LINK / APP ]';
      logContent.appendChild(a);
      logContent.scrollTop = logContent.scrollHeight;
    }

    function speakText(text) {
    if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
    }

    const utterance = new SpeechSynthesisUtterance(text);

    if (selectedVoice) {
        utterance.voice = selectedVoice;
    }

    utterance.rate = 1.05;  // Reduces awkward pauses between words
    utterance.pitch = 0.85; // Lowers pitch for a deeper male voice

    utterance.onstart = () => {
        isJarvisSpeaking = true;
        updateState('speaking');
    };

    utterance.onend = () => {
        isJarvisSpeaking = false;
        if (isSessionActive) {
            updateState('listening');
        } else {
            updateState('idle');
        }
    };

    window.speechSynthesis.speak(utterance);
}

    function updateState(state) {
      statusBadge.innerText = state.toUpperCase();
      arcReactor.className = `arc-reactor state-${state}`;
    }

    function appendLog(sender, text) {
      const p = document.createElement('div');
      p.className = sender === 'YOU' ? 'user-msg' : sender === 'JARVIS' ? 'jarvis-msg' : 'sys-msg';
      p.innerText = `[${sender}] ${text}`;
      logContent.appendChild(p);
      
      while (logContent.children.length > 150) { logContent.removeChild(logContent.firstChild); }
      logContent.scrollTop = logContent.scrollHeight;
    }

    initBtn.addEventListener('click', () => {
      loadVoices();
      setupRecognition();
      try {
        recognition.start();
        initBtn.style.display = 'none';
        appendLog('SYS', 'Audio matrix online. Ambient listening enabled.');
      } catch (e) {
        appendLog('SYS', 'Microphone permission required.');
      }
    });
  </script>
</body>
</html>
