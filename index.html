<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>J.A.R.V.I.S. System HUD</title>
  <style>
    /* 4. THE INTERACTIVE HUD UI: Color Palette */
    :root {
      --bg-color: #050b14;
      --primary-blue: #00d8ff;       /* Idle */
      --listening-green: #00ff66;    /* Listening */
      --processing-yellow: #ffcc00;  /* Processing */
      --speaking-purple: #9d00ff;    /* Speaking */
      --text-color: #e0f7fc;
      --panel-bg: rgba(6, 20, 38, 0.7);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
    body { background-color: var(--bg-color); color: var(--text-color); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    
    /* Secure API Storage Screen */
    #startup-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: var(--bg-color); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;
    }
    .startup-box {
      background: var(--panel-bg); border: 1px solid var(--primary-blue);
      padding: 30px 20px; text-align: center; border-radius: 8px; width: 100%; max-width: 400px;
      box-shadow: 0 0 30px rgba(0, 216, 255, 0.15);
    }
    .startup-box h1 { color: var(--primary-blue); font-size: 26px; margin-bottom: 20px; text-shadow: 0 0 10px var(--primary-blue); letter-spacing: 2px; }
    .startup-box input { width: 100%; padding: 12px; background: rgba(0,0,0,0.6); border: 1px solid var(--primary-blue); color: white; margin-bottom: 20px; font-size: 14px; text-align: center; outline: none; }
    .startup-box button { width: 100%; padding: 12px; background: var(--primary-blue); color: #000; font-weight: bold; border: none; cursor: pointer; font-size: 16px; transition: 0.3s; }
    .startup-box button:active { transform: scale(0.98); }

    /* Main HUD Layout */
    #main-app { display: none; flex-direction: column; height: 100vh; padding: 15px; }
    .hud-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--primary-blue); padding-bottom: 10px; font-size: 12px; flex-shrink: 0; }
    .badge { padding: 4px 8px; border-radius: 4px; border: 1px solid var(--primary-blue); color: var(--primary-blue); font-weight: bold; }
    
    /* Animated Arc Reactor */
    .arc-container { display: flex; justify-content: center; align-items: center; flex-grow: 1; min-height: 150px; }
    .arc-reactor { width: 120px; height: 120px; border-radius: 50%; position: relative; display: flex; justify-content: center; align-items: center; transition: all 0.5s ease; }
    .core { width: 40px; height: 40px; border-radius: 50%; background: white; box-shadow: 0 0 20px var(--primary-blue); transition: all 0.5s ease; }
    .ring-1, .ring-2 { position: absolute; border-radius: 50%; border: 2px dashed var(--primary-blue); transition: all 0.5s ease; }
    .ring-1 { width: 80px; height: 80px; animation: spin 8s linear infinite; }
    .ring-2 { width: 110px; height: 110px; animation: spin-reverse 12s linear infinite; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
    
    /* Dynamic Arc States */
    .state-idle { box-shadow: 0 0 30px var(--primary-blue); }
    .state-idle .ring-1, .state-idle .ring-2 { border-color: var(--primary-blue); }
    
    .state-listening { box-shadow: 0 0 30px var(--listening-green); }
    .state-listening .core { box-shadow: 0 0 20px var(--listening-green); }
    .state-listening .ring-1, .state-listening .ring-2 { border-color: var(--listening-green); }
    
    .state-processing { box-shadow: 0 0 30px var(--processing-yellow); }
    .state-processing .core { box-shadow: 0 0 20px var(--processing-yellow); }
    .state-processing .ring-1, .state-processing .ring-2 { border-color: var(--processing-yellow); }
    
    .state-speaking { box-shadow: 0 0 30px var(--speaking-purple); }
    .state-speaking .core { box-shadow: 0 0 20px var(--speaking-purple); }
    .state-speaking .ring-1, .state-speaking .ring-2 { border-color: var(--speaking-purple); }
    
    /* Controls & Live Terminal */
    .glow-btn { background: rgba(0, 216, 255, 0.1); border: 1px solid var(--primary-blue); color: var(--primary-blue); padding: 15px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 15px; border-radius: 4px; flex-shrink: 0; }
    
    .terminal-box { background: var(--panel-bg); border: 1px solid var(--primary-blue); border-radius: 6px; display: flex; flex-direction: column; height: 45vh; flex-shrink: 0; }
    .terminal-header { font-size: 11px; color: var(--primary-blue); padding: 8px 10px; border-bottom: 1px solid rgba(0, 216, 255, 0.3); background: rgba(0, 0, 0, 0.5); }
    
    .log-content { flex-grow: 1; overflow-y: auto; padding: 10px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
    .log-content::-webkit-scrollbar { width: 4px; }
    .log-content::-webkit-scrollbar-thumb { background: var(--primary-blue); border-radius: 4px; }
    
    .user-msg { color: var(--listening-green); padding-left: 10px; border-left: 2px solid var(--listening-green); }
    .jarvis-msg { color: var(--text-color); padding-left: 10px; border-left: 2px solid var(--speaking-purple); }
    .sys-msg { color: #888; font-style: italic; font-size: 11px; }
    
    /* Pop-Up Fallback Button */
    .action-launch-btn { display: inline-block; margin-top: 5px; padding: 10px; background: rgba(157, 0, 255, 0.2); border: 1px solid var(--speaking-purple); color: #fff; text-decoration: none; font-weight: bold; border-radius: 4px; font-size: 11px; text-align: center; }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="startup-screen">
    <div class="startup-box">
      <h1>J.A.R.V.I.S. OS</h1>
      <input type="password" id="startup-api-key" placeholder="Enter Gemini API Key">
      <button id="boot-btn">AUTHENTICATE</button>
    </div>
  </div>

  <!-- MAIN HUD -->
  <div id="main-app">
    <header class="hud-header">
      <div class="system-status">STARK INDUSTRIES // UPLINK SECURE</div>
      <div id="status-badge" class="badge">IDLE</div>
    </header>

    <div class="arc-container">
      <div id="arc-reactor" class="arc-reactor state-idle">
        <div class="core"></div>
        <div class="ring-1"></div>
        <div class="ring-2"></div>
      </div>
    </div>

    <button id="init-btn" class="glow-btn">INITIALIZE AUDIO MATRIX</button>

    <section class="terminal-box">
      <div class="terminal-header">COMMUNICATION LOG</div>
      <div id="log-content" class="log-content"></div>
    </section>
  </div>

  <script>
    let apiKey = localStorage.getItem('jarvis_api_key') || '';
    let recognition = null;
    let isJarvisSpeaking = false;
    let isSessionActive = false;
    let sessionTimeoutTimer = null;
    let selectedVoice = null;

    const startupScreen = document.getElementById('startup-screen');
    const mainApp = document.getElementById('main-app');
    const logContent = document.getElementById('log-content');
    const statusBadge = document.getElementById('status-badge');
    const arcReactor = document.getElementById('arc-reactor');
    const initBtn = document.getElementById('init-btn');

    // --- SECURE API STORAGE ---
    function bootSystem() {
      startupScreen.style.display = 'none';
      mainApp.style.display = 'flex';
      appendLog('SYS', 'System Booted. Ready for audio initialization.');
    }
    if (apiKey) bootSystem();
    document.getElementById('boot-btn').addEventListener('click', () => {
      const key = document.getElementById('startup-api-key').value.trim();
      if (key) { localStorage.setItem('jarvis_api_key', key); apiKey = key; bootSystem(); }
    });

    // --- 1. THE ALWAYS-ON VOICE ENGINE ---
    
    // Auto-Voice Selection (UK Male)
    function loadVoices() {
      const voices = window.speechSynthesis.getVoices();
      selectedVoice = voices.find(v => (v.lang.includes('en-GB') || v.lang.includes('en_GB')) && (v.name.includes('Male') || v.name.includes('Daniel'))) || voices[0];
    }
    window.speechSynthesis.onvoiceschanged = loadVoices;

    function setupRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return appendLog('SYS', 'Speech API not supported in this browser.');
      
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;

      recognition.onstart = () => { if (!isJarvisSpeaking) updateState('listening'); };

      recognition.onresult = (event) => {
        // Anti-Feedback Guard: Ignore if speaking
        if (isJarvisSpeaking) return;
        
        const transcript = event.results[event.results.length - 1][0].transcript.trim();
        const lower = transcript.toLowerCase();
        
        // Wake Word & Continuous Conversation Mode
        if (lower.includes('jarvis') || isSessionActive) {
          let command = transcript.replace(/jarvis/gi, '').trim() || 'Awaiting directive.';
          appendLog('YOU', transcript);
          activateSession();
          sendToGeminiDirectly(command);
        }
      };

      recognition.onerror = (e) => { if(e.error !== 'no-speech') appendLog('SYS', 'Mic Error: ' + e.error); };
      recognition.onend = () => { if (!isJarvisSpeaking) setTimeout(() => { try { recognition.start(); } catch(e){} }, 300); };
    }

    // 15-Second Continuous Conversation Timer
    function activateSession() {
      isSessionActive = true;
      clearTimeout(sessionTimeoutTimer);
      sessionTimeoutTimer = setTimeout(() => {
        isSessionActive = false;
        appendLog('SYS', '15-second conversational window closed. Awaiting wake word.');
        updateState('idle');
      }, 15000);
    }

    // --- 2. THE AI BRAIN (GEMINI 3.5 FLASH) ---
    async function sendToGeminiDirectly(message) {
      updateState('processing');
      // Using EXACTLY the model requested
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash:generateContent?key=${apiKey}`;
      
      const payload = {
        systemInstruction: {
          parts: [{ text: "You are J.A.R.V.I.S., an advanced AI assistant. Address the user as 'Sir' or 'Boss'. Provide detailed, intelligent answers. Never use markdown, emojis, or bullet points. CRITICAL: Return ONLY a raw JSON object with two properties: 'speech' (the exact words you say) and 'actionUrl' (a full HTTPS URL if the user asks to open an app or search, otherwise null). Do not wrap the JSON in markdown blocks." }]
        },
        contents: [{ parts: [{ text: message }] }]
      };

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error.message);

        // Clean output to ensure TTS works flawlessly
        const rawText = data.candidates[0].content.parts[0].text;
        const cleanJson = rawText.replace(/^```json\s*/, '').replace(/\s*```$/, '').trim();
        const parsedData = JSON.parse(cleanJson);

        appendLog('JARVIS', parsedData.speech);
        
        // --- 3. ACTION AND APP LAUNCHING ---
        if (parsedData.actionUrl) handleAppLaunch(parsedData.actionUrl);
        
        speakText(parsedData.speech);

      } catch (error) {
        appendLog('SYS', 'API Error: ' + error.message);
        speakText('I am unable to connect to the mainframe at this time, Sir.');
        updateState('listening');
      }
    }

    // Mobile Deep-Linking & Pop-Up Fallback
    function handleAppLaunch(url) {
      // 1. Try automatic deep link
      try { window.open(url, '_blank'); } catch(e) {}
      
      // 2. Generate Pop-up fallback button
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.className = 'action-launch-btn'; a.innerText = '[ TAP TO OPEN LINK / APP ]';
      logContent.appendChild(a);
      logContent.scrollTop = logContent.scrollHeight;
    }

    // Anti-Feedback Guard Audio Controller
    function speakText(text) {
      if (!text) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      if (selectedVoice) utterance.voice = selectedVoice;
      
      // Cut off mic before speaking
      isJarvisSpeaking = true;
      updateState('speaking');
      try { recognition.abort(); } catch(e){}

      utterance.onend = utterance.onerror = () => {
        // Re-enable mic after speaking
        isJarvisSpeaking = false;
        updateState(isSessionActive ? 'listening' : 'idle');
        setTimeout(() => { try { recognition.start(); } catch(e){} }, 500);
      };
      window.speechSynthesis.speak(utterance);
    }

    // --- 4. THE INTERACTIVE HUD UI ---
    function updateState(state) {
      statusBadge.innerText = state.toUpperCase();
      arcReactor.className = `arc-reactor state-${state}`;
    }

    function appendLog(sender, text) {
      const p = document.createElement('div');
      p.className = sender === 'YOU' ? 'user-msg' : sender === 'JARVIS' ? 'jarvis-msg' : 'sys-msg';
      p.innerText = `[${sender}] ${text}`;
      logContent.appendChild(p);
      
      while (logContent.children.length > 150) { logContent.removeChild(logContent.firstChild); }
      logContent.scrollTop = logContent.scrollHeight;
    }

    initBtn.addEventListener('click', () => {
      loadVoices();
      setupRecognition();
      try {
        recognition.start();
        initBtn.style.display = 'none';
        appendLog('SYS', 'Audio matrix online. Ambient listening enabled.');
      } catch (e) {
        appendLog('SYS', 'Microphone permission required.');
      }
    });
  </script>
</body>
</html>
